<div id="odontograma-wrap"
     data-pid="{{ patient.id }}"
     data-save-url="{{ url_for('patients.odontograma_save_json', pid=patient.id) }}"
     style="position:relative">

  <style>
    
    #odontograma-wrap .field{
      background:#fff; color:#111; border:1px solid #e5e7eb;
      border-radius:8px; padding:8px 10px; min-height:36px;
    }
    .tooth{ cursor:pointer; }
    .tooth:hover rect{ stroke:#a084ff; stroke-width:2 }
    .tooth.selected rect{ stroke:#684ee4; stroke-width:3 }
    .odonto-menu{
      position:absolute; z-index:20; background:#fff; border:1px solid #dcdff4;
      border-radius:12px; padding:10px; width:260px; box-shadow:0 12px 32px rgba(48,61,37,.14);max-width:100%;
      display:none
    }
    .odonto-menu .odonto-row{ display:flex; gap:6px; margin-top:8px }
    .odonto-tip{
      position:absolute; pointer-events:none; background:#fff; border:1px solid #dcdff4;
      border-radius:8px; padding:6px 8px; font-size:12px; color:#4b577b; display:none; z-index:15
    }
  </style>

  <svg id="odontograma-svg" viewBox="0 0 550 440" role="group" aria-label="Odontograma com numeração dos dentes"
       style="width:100%;max-width:650px;display:block;margin:auto;background:#f6f7ff;border:1px solid #e2e5f6;border-radius:12px">
    {% macro tooth(x,y,w,h,num) -%}
      <g class="tooth" data-tooth="{{ num }}" tabindex="0" role="button" aria-label="Dente {{ num }}: definir status">
        <rect x="{{ x }}" y="{{ y }}" width="{{ w }}" height="{{ h }}" rx="10" ry="10"
              fill="#ffffff" stroke="#d0d6ef"></rect>
        <text x="{{ x + w/2 }}" y="{{ y + h*0.55 }}" text-anchor="middle"
              font-size="20" fill="#465575">🦷</text>
        <text x="{{ x + w/2 }}" y="{{ y + h - 6 }}" text-anchor="middle"
              font-size="11" fill="#6d7b9f">{{ num }}</text>
      </g>
    {%- endmacro %}

    {% set top_left    = [18,17,16,15,14,13,12,11] %}
    {% set top_right   = [21,22,23,24,25,26,27,28] %}
    {% set bottom_right= [31,32,33,34,35,36,37,38] %}
    {% set bottom_left = [48,47,46,45,44,43,42,41] %}

    {% for i in range(top_left|length) %}
      {{ tooth(40 + i*60, 40, 50, 60, top_left[i]) }}
    {% endfor %}
    {% for i in range(top_right|length) %}
      {{ tooth(40 + i*60, 140, 50, 60, top_right[i]) }}
    {% endfor %}
    {% for i in range(bottom_right|length) %}
      {{ tooth(40 + i*60, 240, 50, 60, bottom_right[i]) }}
    {% endfor %}
    {% for i in range(bottom_left|length) %}
      {{ tooth(40 + i*60, 340, 50, 60, bottom_left[i]) }}
    {% endfor %}
  </svg>

  <div id="odonto-menu" class="odonto-menu">
    <div style="font-weight:600;margin-bottom:6px;color:#465575">Definir status</div>
    <select id="odonto-status" class="field" aria-label="Status do dente" style="width:100%">
      <option value="saudavel">Saudável</option>
      <option value="carie">Cárie</option>
      <option value="restauracao">Restauração</option>
      <option value="canal">Trat. de canal</option>
      <option value="fratura">Fratura</option>
      <option value="ausente">Ausente/Extraído</option>
      <option value="implante">Implante</option>
      <option value="protese">Prótese</option>
      <option value="mobilidade">Mobilidade</option>
      <option value="placa">Placa</option>
    </select>
    <div class="odonto-row">
      <input id="odonto-note" class="field" aria-label="Observação do dente" placeholder="Observação (opcional)" style="flex:1">
    </div>
    <div class="odonto-row" style="justify-content:flex-end">
      <button id="odonto-cancel" class="btn btn-sm btn-outline-secondary">Cancelar</button>
      <button id="odonto-save" class="btn btn-sm btn-brand">Salvar</button>
    </div>
  </div>

  <div id="odonto-tip" class="odonto-tip"></div>
</div>

<script>window.ODONTO_STATE = {{ mapa|tojson }};</script>
<script src="{{ url_for('static', filename='odontograma_inline.js') }}?v=57"></script>
